<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>烘焙線上訂購</title>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f1ea;
  color: #4b382d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft JhengHei",
    "Noto Sans TC",
    sans-serif;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 15px 12px 125px;
}

.header {
  text-align: center;
  padding: 22px 5px 18px;
}

.header-icon {
  font-size: 48px;
}

.header h1 {
  margin: 4px 0;
  font-size: 28px;
  color: #704a32;
}

.header p {
  color: #927866;
  font-size: 14px;
}

.tabs {
  display: flex;
  background: #eadfd5;
  padding: 5px;
  border-radius: 14px;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 12px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 800;
  color: #765e4e;
}

.tab.active {
  background: white;
  color: #704a32;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section {
  display: none;
}

.section.active {
  display: block;
}

.card {
  background: white;
  padding: 17px;
  border-radius: 18px;
  margin-bottom: 14px;
  box-shadow: 0 3px 14px rgba(94,63,43,.08);
}

.card-title {
  font-size: 19px;
  font-weight: 900;
  color: #704a32;
  margin-bottom: 15px;
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  font-weight: 800;
  margin-bottom: 7px;
}

.required {
  color: #c84f40;
}

select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #dccdc2;
  border-radius: 11px;
  background: #fffdfb;
  font-size: 16px;
  color: #49382d;
}

textarea {
  min-height: 82px;
  resize: vertical;
}

.product-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.product-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border: 1px solid #eee2d9;
  background: #fffdfb;
  border-radius: 14px;
  padding: 13px 11px;
}

.product-info {
  flex: 1;
  min-width: 0;
}

.product-name {
  font-size: 16px;
  font-weight: 900;
}

.product-price {
  color: #ad6740;
  font-weight: 800;
  margin-top: 4px;
}

.qty-box {
  display: flex;
  align-items: center;
  gap: 7px;
}

.qty-btn {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: #8d5c3b;
  color: white;
  font-size: 23px;
  line-height: 36px;
}

.qty-value {
  width: 36px;
  text-align: center;
  font-size: 18px;
  font-weight: 900;
}

.btn {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
}

.btn-primary {
  background: #8d5c3b;
  color: white;
}

.btn-secondary {
  background: #eee4dc;
  color: #654b3a;
}

.btn:disabled {
  opacity: .55;
}

.sticky-summary {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255,255,255,.98);
  box-shadow: 0 -4px 18px rgba(0,0,0,.08);
  border-top: 1px solid #eadfd6;
  z-index: 50;
}

.sticky-inner {
  max-width: 720px;
  margin: auto;
  padding: 10px 13px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.summary-text {
  flex: 1;
}

.summary-small {
  color: #8c7565;
  font-size: 13px;
}

.summary-amount {
  color: #a85931;
  font-size: 22px;
  font-weight: 900;
}

.submit-small {
  width: 145px;
}

.message {
  display: none;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
}

.message.error {
  display: block;
  background: #fff0ee;
  color: #a13d31;
  border: 1px solid #f0c7c1;
}

.loading,
.empty-result {
  text-align: center;
  padding: 25px 10px;
  color: #8f7767;
}

.search-summary {
  background: #f1e6dd;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 12px;
  font-weight: 800;
}

.order-result-card {
  background: white;
  border: 1px solid #eadfd6;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(94,63,43,.06);
}

.order-person {
  font-size: 20px;
  font-weight: 900;
  color: #704a32;
}

.order-meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding: 7px 0 11px;
  margin-bottom: 10px;
  border-bottom: 1px dashed #dfd0c4;
}

.order-date {
  font-weight: 800;
}

.order-time {
  font-size: 12px;
  color: #998071;
}

.item-header,
.order-product {
  display: grid;
  grid-template-columns: 1fr 48px 72px 82px;
  gap: 5px;
}

.item-header {
  padding: 7px 0;
  border-bottom: 1px solid #e9ddd4;
  color: #927563;
  font-size: 12px;
  font-weight: 800;
}

.order-product {
  padding: 9px 0;
  border-bottom: 1px solid #f2eae4;
  font-size: 14px;
}

.item-name {
  font-weight: 800;
}

.item-number {
  text-align: right;
  white-space: nowrap;
}

.order-note {
  background: #faf6f2;
  border-radius: 9px;
  padding: 10px;
  margin-top: 10px;
}

.product-total-card {
  background: white;
  border: 2px solid #9a603d;
  border-radius: 16px;
  padding: 16px;
  margin: 22px 0 30px;
}

.product-total-title {
  font-size: 21px;
  font-weight: 900;
  color: #8d5c3b;
  margin-bottom: 13px;
}

.product-total-header,
.product-total-row {
  display: grid;
  grid-template-columns: 1fr 90px;
  padding: 9px 5px;
}

.product-total-header {
  border-bottom: 2px solid #e1d1c5;
  font-weight: 900;
}

.product-total-row {
  border-bottom: 1px solid #eee3db;
  font-weight: 800;
}

.product-total-header div:last-child,
.product-total-qty {
  text-align: right;
}

.product-total-qty {
  font-size: 18px;
  color: #a85931;
  font-weight: 900;
}

.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(48,34,25,.55);
  z-index: 999;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 20px;
  padding: 25px 20px;
  text-align: center;
}

.success-icon {
  width: 72px;
  height: 72px;
  margin: auto;
  border-radius: 50%;
  background: #e9f6eb;
  color: #4d9657;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: 900;
}

.modal-title {
  font-size: 23px;
  font-weight: 900;
  margin: 13px 0;
}

.modal-content {
  line-height: 1.8;
  margin-bottom: 18px;
}

.modal-amount {
  color: #a85931;
  font-size: 23px;
  font-weight: 900;
}

@media(max-width:480px) {

  .container {
    padding-left: 10px;
    padding-right: 10px;
  }

  .card {
    padding: 15px 12px;
  }

  .item-header,
  .order-product {
    grid-template-columns:
      1fr 34px 63px 72px;
    font-size: 12px;
  }

  .submit-small {
    width: 130px;
  }

}

</style>

</head>


<body>


<div class="container">


<div class="header">

  <div class="header-icon">
    🍞
  </div>

  <h1>
    烘焙線上訂購
  </h1>

  <p>
    選擇訂購人、日期及商品即可完成訂購
  </p>

</div>


<div class="tabs">

  <button
    id="orderTab"
    class="tab active"
    onclick="switchTab('order')"
  >
    我要訂購
  </button>

  <button
    id="searchTab"
    class="tab"
    onclick="switchTab('search')"
  >
    查詢訂單
  </button>

</div>


<!-- 我要訂購 -->
<div
  id="orderSection"
  class="section active"
>


<div class="card">

  <div class="card-title">
    訂購資料
  </div>


  <div class="form-group">

    <label>
      訂購人
      <span class="required">*</span>
    </label>

    <select id="customerName">

      <option value="">
        名單載入中...
      </option>

    </select>

  </div>


  <div class="form-group">

    <label>
      訂購日期
      <span class="required">*</span>
    </label>

    <select id="orderDate">

      <option value="">
        日期載入中...
      </option>

    </select>

  </div>


  <div class="form-group">

    <label>
      備註
    </label>

    <textarea
      id="note"
      placeholder="如有其他需求可填寫"
    ></textarea>

  </div>

</div>


<div class="card">

  <div class="card-title">
    選擇商品
  </div>

  <div
    id="productList"
    class="product-list"
  >

    <div class="loading">
      商品載入中...
    </div>

  </div>

</div>


<div
  id="orderMessage"
  class="message"
></div>


<button
  class="btn btn-secondary"
  onclick="resetOrder(false)"
>
  清除全部
</button>


</div>


<!-- 查詢訂單 -->
<div
  id="searchSection"
  class="section"
>


<div class="card">

  <div class="card-title">
    查詢訂單
  </div>


  <div class="form-group">

    <label>
      訂購人
    </label>

    <select id="searchName">

      <option value="">
        全部訂購人
      </option>

    </select>

  </div>


  <div class="form-group">

    <label>
      訂購日期
    </label>

    <select id="searchDate">

      <option value="">
        全部日期
      </option>

    </select>

  </div>


  <button
    id="searchButton"
    class="btn btn-primary"
    onclick="searchOrder()"
  >
    查詢訂單
  </button>


  <div
    id="searchMessage"
    class="message"
    style="margin-top:12px;"
  ></div>

</div>


<div id="searchResult"></div>


</div>


</div>


<!-- 下方固定總計 -->
<div
  id="stickySummary"
  class="sticky-summary"
>

<div class="sticky-inner">

  <div class="summary-text">

    <div class="summary-small">
      共
      <span id="totalQty">0</span>
      件
    </div>

    <div class="summary-amount">
      NT$
      <span id="totalAmount">0</span>
    </div>

  </div>


  <button
    id="submitButton"
    class="btn btn-primary submit-small"
    onclick="submitOrder()"
  >
    送出訂單
  </button>

</div>

</div>


<!-- 成功視窗 -->
<div
  id="successModal"
  class="modal"
>

<div class="modal-box">

  <div class="success-icon">
    ✓
  </div>

  <div class="modal-title">
    訂購成功
  </div>

  <div
    id="successContent"
    class="modal-content"
  ></div>

  <button
    class="btn btn-primary"
    onclick="closeSuccessModal()"
  >
    完成
  </button>

</div>

</div>


<script>


/*************************************************
 * ★★★ 這一行一定要改 ★★★
 *
 * 把下面網址換成你的 Apps Script /exec 網址
 *************************************************/
const API_URL =
  'https://script.google.com/macros/s/AKfycbzg94WYRqsrLdRPt9MrK6R-MfeMVnh1oAY4klCav758SIEeeWnaG2jwn5Wx1j07puyQ/exec';


/*************************************************
 * 系統資料
 *************************************************/
let products = [];

let customers = [];

let openDates = [];

let quantities = {};


/*************************************************
 * JSONP 編號
 *************************************************/
let jsonpCounter = 0;


/*************************************************
 * 啟動
 *************************************************/
window.addEventListener(
  'load',
  function() {

    loadInitialData();

  }
);


/*************************************************
 * JSONP
 *************************************************/
function jsonpRequest(
  params,
  success,
  failure
) {

  jsonpCounter++;


  const callbackName =
    '__bakeryCallback_' +
    Date.now() +
    '_' +
    jsonpCounter;


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  const timer =
    setTimeout(
      function() {

        cleanup();


        if (failure) {

          failure(
            new Error(
              '目前無法連線到訂單系統，請稍後再試。'
            )
          );

        }

      },
      20000
    );


  function cleanup() {

    if (finished) {

      return;

    }


    finished =
      true;


    clearTimeout(
      timer
    );


    try {

      delete window[
        callbackName
      ];

    }

    catch (error) {

      window[
        callbackName
      ] = undefined;

    }


    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }


  window[
    callbackName
  ] =
    function(data) {

      cleanup();


      if (success) {

        success(
          data
        );

      }

    };


  const query =
    new URLSearchParams();


  Object.keys(
    params
  ).forEach(
    function(key) {

      query.append(
        key,
        params[key]
      );

    }
  );


  query.append(
    'callback',
    callbackName
  );


  script.src =
    API_URL +
    '?' +
    query.toString();


  script.onerror =
    function() {

      cleanup();


      if (failure) {

        failure(
          new Error(
            '目前無法連線到訂單系統，請稍後再試。'
          )
        );

      }

    };


  document.body.appendChild(
    script
  );

}


/*************************************************
 * 初始化
 *************************************************/
function loadInitialData() {

  if (
    !API_URL ||
    API_URL.indexOf(
      'script.google.com'
    ) === -1
  ) {

    showMessage(
      'orderMessage',
      '請先在 index.html 設定 Apps Script /exec 網址。',
      'error'
    );


    document.getElementById(
      'productList'
    ).innerHTML =
      '<div class="empty-result">' +
      '尚未設定 Apps Script 網址' +
      '</div>';


    return;

  }


  jsonpRequest(

    {
      action:
        'initial'
    },

    function(data) {

      if (
        !data ||
        data.success === false
      ) {

        showMessage(
          'orderMessage',
          data && data.message
            ? data.message
            : '資料載入失敗',
          'error'
        );

        return;

      }


      products =
        data.products || [];


      customers =
        data.customers || [];


      openDates =
        data.dates || [];


      renderCustomers();

      renderDates();

      renderProducts();

      updateTotal();

    },

    function(error) {

      showMessage(
        'orderMessage',
        error.message,
        'error'
      );


      document.getElementById(
        'productList'
      ).innerHTML =
        '<div class="empty-result">' +
        '資料載入失敗' +
        '</div>';

    }

  );

}


/*************************************************
 * 訂購人
 *************************************************/
function renderCustomers() {

  const orderSelect =
    document.getElementById(
      'customerName'
    );


  const searchSelect =
    document.getElementById(
      'searchName'
    );


  orderSelect.innerHTML =
    '<option value="">請選擇訂購人</option>';


  searchSelect.innerHTML =
    '<option value="">全部訂購人</option>';


  customers.forEach(
    function(customer) {

      const option1 =
        document.createElement(
          'option'
        );


      option1.value =
        customer;


      option1.textContent =
        customer;


      orderSelect.appendChild(
        option1
      );


      const option2 =
        document.createElement(
          'option'
        );


      option2.value =
        customer;


      option2.textContent =
        customer;


      searchSelect.appendChild(
        option2
      );

    }
  );

}


/*************************************************
 * 日期
 *************************************************/
function renderDates() {

  const orderSelect =
    document.getElementById(
      'orderDate'
    );


  const searchSelect =
    document.getElementById(
      'searchDate'
    );


  orderSelect.innerHTML = '';


  searchSelect.innerHTML =
    '<option value="">全部日期</option>';


  if (
    openDates.length === 0
  ) {

    orderSelect.innerHTML =
      '<option value="">' +
      '目前尚未開放訂購日期' +
      '</option>';


    return;

  }


  const first =
    document.createElement(
      'option'
    );


  first.value = '';


  first.textContent =
    '請選擇訂購日期';


  orderSelect.appendChild(
    first
  );


  openDates.forEach(
    function(date) {

      const label =
        formatDateLabel(
          date
        );


      const option1 =
        document.createElement(
          'option'
        );


      option1.value =
        date;


      option1.textContent =
        label;


      orderSelect.appendChild(
        option1
      );


      const option2 =
        document.createElement(
          'option'
        );


      option2.value =
        date;


      option2.textContent =
        label;


      searchSelect.appendChild(
        option2
      );

    }
  );

}


/*************************************************
 * 商品
 *************************************************/
function renderProducts() {

  const container =
    document.getElementById(
      'productList'
    );


  container.innerHTML = '';


  if (
    products.length === 0
  ) {

    container.innerHTML =
      '<div class="empty-result">' +
      '目前沒有商品' +
      '</div>';


    return;

  }


  products.forEach(
    function(product) {

      quantities[
        product.name
      ] = 0;


      const item =
        document.createElement(
          'div'
        );


      item.className =
        'product-item';


      const info =
        document.createElement(
          'div'
        );


      info.className =
        'product-info';


      const name =
        document.createElement(
          'div'
        );


      name.className =
        'product-name';


      name.textContent =
        product.name;


      const price =
        document.createElement(
          'div'
        );


      price.className =
        'product-price';


      price.textContent =
        'NT$ ' +
        formatMoney(
          product.price
        );


      info.appendChild(
        name
      );


      info.appendChild(
        price
      );


      const qtyBox =
        document.createElement(
          'div'
        );


      qtyBox.className =
        'qty-box';


      const minus =
        document.createElement(
          'button'
        );


      minus.type =
        'button';


      minus.className =
        'qty-btn';


      minus.textContent =
        '−';


      minus.onclick =
        function() {

          changeQty(
            product.name,
            -1
          );

        };


      const qty =
        document.createElement(
          'div'
        );


      qty.className =
        'qty-value';


      qty.id =
        getQtyId(
          product.name
        );


      qty.textContent =
        '0';


      const plus =
        document.createElement(
          'button'
        );


      plus.type =
        'button';


      plus.className =
        'qty-btn';


      plus.textContent =
        '+';


      plus.onclick =
        function() {

          changeQty(
            product.name,
            1
          );

        };


      qtyBox.appendChild(
        minus
      );


      qtyBox.appendChild(
        qty
      );


      qtyBox.appendChild(
        plus
      );


      item.appendChild(
        info
      );


      item.appendChild(
        qtyBox
      );


      container.appendChild(
        item
      );

    }
  );

}


/*************************************************
 * 數量
 *************************************************/
function changeQty(
  productName,
  amount
) {

  let current =
    Number(
      quantities[
        productName
      ] || 0
    );


  current +=
    amount;


  if (
    current < 0
  ) {

    current = 0;

  }


  quantities[
    productName
  ] =
    current;


  const element =
    document.getElementById(
      getQtyId(
        productName
      )
    );


  if (element) {

    element.textContent =
      current;

  }


  updateTotal();

}


/*************************************************
 * 商品 ID
 *************************************************/
function getQtyId(
  name
) {

  let hash = 0;


  for (
    let i = 0;
    i < name.length;
    i++
  ) {

    hash =
      ((hash << 5) - hash) +
      name.charCodeAt(i);


    hash =
      hash & hash;

  }


  return (
    'qty_' +
    Math.abs(
      hash
    )
  );

}


/*************************************************
 * 下單總計
 *************************************************/
function updateTotal() {

  let totalQty = 0;

  let totalAmount = 0;


  products.forEach(
    function(product) {

      const qty =
        Number(
          quantities[
            product.name
          ] || 0
        );


      totalQty +=
        qty;


      totalAmount +=
        qty *
        Number(
          product.price
        );

    }
  );


  document.getElementById(
    'totalQty'
  ).textContent =
    totalQty;


  document.getElementById(
    'totalAmount'
  ).textContent =
    formatMoney(
      totalAmount
    );

}


/*************************************************
 * 送出
 *************************************************/
function submitOrder() {

  hideMessage(
    'orderMessage'
  );


  const customerName =
    document.getElementById(
      'customerName'
    ).value;


  const orderDate =
    document.getElementById(
      'orderDate'
    ).value;


  const note =
    document.getElementById(
      'note'
    ).value.trim();


  if (!customerName) {

    showMessage(
      'orderMessage',
      '請選擇訂購人',
      'error'
    );


    return;

  }


  if (!orderDate) {

    showMessage(
      'orderMessage',
      '請選擇訂購日期',
      'error'
    );


    return;

  }


  let totalQty = 0;


  products.forEach(
    function(product) {

      totalQty +=
        Number(
          quantities[
            product.name
          ] || 0
        );

    }
  );


  if (
    totalQty <= 0
  ) {

    showMessage(
      'orderMessage',
      '請至少選擇一項商品',
      'error'
    );


    return;

  }


  const order = {

    customerName:
      customerName,

    orderDate:
      orderDate,

    note:
      note,

    items:
      quantities

  };


  const button =
    document.getElementById(
      'submitButton'
    );


  button.disabled =
    true;


  button.textContent =
    '送出中...';


  jsonpRequest(

    {
      action:
        'submit',

      order:
        JSON.stringify(
          order
        )
    },

    function(result) {

      button.disabled =
        false;


      button.textContent =
        '送出訂單';


      if (
        !result ||
        result.success === false
      ) {

        showMessage(
          'orderMessage',
          result && result.message
            ? result.message
            : '訂單送出失敗',
          'error'
        );


        return;

      }


      showSuccessModal(
        result
      );


      resetOrder(
        true
      );

    },

    function(error) {

      button.disabled =
        false;


      button.textContent =
        '送出訂單';


      showMessage(
        'orderMessage',
        error.message,
        'error'
      );

    }

  );

}


/*************************************************
 * 成功視窗
 *************************************************/
function showSuccessModal(
  result
) {

  document.getElementById(
    'successContent'
  ).innerHTML =

    '訂購人：<strong>' +
    escapeHtml(
      result.customerName
    ) +
    '</strong><br>' +

    '訂購日期：<strong>' +
    escapeHtml(
      formatDateLabel(
        result.orderDate
      )
    ) +
    '</strong><br>' +

    '總數量：<strong>' +
    Number(
      result.totalQty || 0
    ) +
    ' 件</strong><br><br>' +

    '訂單金額<br>' +

    '<span class="modal-amount">' +
    'NT$ ' +
    formatMoney(
      result.totalAmount
    ) +
    '</span>';


  document.getElementById(
    'successModal'
  ).classList.add(
    'show'
  );

}


/*************************************************
 * 關閉成功
 *************************************************/
function closeSuccessModal() {

  document.getElementById(
    'successModal'
  ).classList.remove(
    'show'
  );

}


/*************************************************
 * 清除
 *************************************************/
function resetOrder(
  keepCustomer
) {

  const oldCustomer =
    document.getElementById(
      'customerName'
    ).value;


  products.forEach(
    function(product) {

      quantities[
        product.name
      ] = 0;


      const element =
        document.getElementById(
          getQtyId(
            product.name
          )
        );


      if (element) {

        element.textContent =
          '0';

      }

    }
  );


  document.getElementById(
    'orderDate'
  ).value = '';


  document.getElementById(
    'note'
  ).value = '';


  document.getElementById(
    'customerName'
  ).value =
    keepCustomer
      ? oldCustomer
      : '';


  hideMessage(
    'orderMessage'
  );


  updateTotal();

}


/*************************************************
 * 查詢
 *************************************************/
function searchOrder() {

  hideMessage(
    'searchMessage'
  );


  const name =
    document.getElementById(
      'searchName'
    ).value;


  const date =
    document.getElementById(
      'searchDate'
    ).value;


  const button =
    document.getElementById(
      'searchButton'
    );


  button.disabled =
    true;


  button.textContent =
    '查詢中...';


  document.getElementById(
    'searchResult'
  ).innerHTML =
    '<div class="loading">' +
    '正在查詢訂單...' +
    '</div>';


  jsonpRequest(

    {
      action:
        'search',

      name:
        name,

      date:
        date
    },

    function(data) {

      button.disabled =
        false;


      button.textContent =
        '查詢訂單';


      if (
        !data ||
        data.success === false
      ) {

        document.getElementById(
          'searchResult'
        ).innerHTML = '';


        showMessage(
          'searchMessage',
          data && data.message
            ? data.message
            : '查詢失敗',
          'error'
        );


        return;

      }


      renderSearchResults(
        data.orders || []
      );

    },

    function(error) {

      button.disabled =
        false;


      button.textContent =
        '查詢訂單';


      document.getElementById(
        'searchResult'
      ).innerHTML = '';


      showMessage(
        'searchMessage',
        error.message,
        'error'
      );

    }

  );

}


/*************************************************
 * 查詢結果
 *************************************************/
function renderSearchResults(
  results
) {

  const container =
    document.getElementById(
      'searchResult'
    );


  container.innerHTML = '';


  if (
    results.length === 0
  ) {

    container.innerHTML =
      '<div class="card empty-result">' +
      '查不到符合條件的訂單' +
      '</div>';


    return;

  }


  const summary =
    document.createElement(
      'div'
    );


  summary.className =
    'search-summary';


  summary.textContent =
    '共查到 ' +
    results.length +
    ' 筆訂單';


  container.appendChild(
    summary
  );


  const productTotals = {};


  results.forEach(
    function(order) {

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'order-result-card';


      /*******************************************
       * 訂購人
       *******************************************/
      const person =
        document.createElement(
          'div'
        );


      person.className =
        'order-person';


      person.textContent =
        order['訂購人'] || '';


      card.appendChild(
        person
      );


      /*******************************************
       * 日期、時間
       *******************************************/
      const meta =
        document.createElement(
          'div'
        );


      meta.className =
        'order-meta';


      const dateDiv =
        document.createElement(
          'div'
        );


      dateDiv.className =
        'order-date';


      dateDiv.textContent =
        '訂購日期：' +
        formatDateLabel(
          order['訂購日期'] || ''
        );


      const timeDiv =
        document.createElement(
          'div'
        );


      timeDiv.className =
        'order-time';


      timeDiv.textContent =
        order['時間戳記'] || '';


      meta.appendChild(
        dateDiv
      );


      meta.appendChild(
        timeDiv
      );


      card.appendChild(
        meta
      );


      /*******************************************
       * 商品表頭
       *******************************************/
      const header =
        document.createElement(
          'div'
        );


      header.className =
        'item-header';


      header.innerHTML =
        '<div>商品</div>' +
        '<div class="item-number">數量</div>' +
        '<div class="item-number">單價</div>' +
        '<div class="item-number">小計</div>';


      card.appendChild(
        header
      );


      /*******************************************
       * 商品
       *******************************************/
      const items =
        order.items || [];


      items.forEach(
        function(item) {

          if (
            !productTotals[
              item.name
            ]
          ) {

            productTotals[
              item.name
            ] = 0;

          }


          productTotals[
            item.name
          ] +=
            Number(
              item.qty || 0
            );


          const row =
            document.createElement(
              'div'
            );


          row.className =
            'order-product';


          const nameDiv =
            document.createElement(
              'div'
            );


          nameDiv.className =
            'item-name';


          nameDiv.textContent =
            item.name;


          const qtyDiv =
            document.createElement(
              'div'
            );


          qtyDiv.className =
            'item-number';


          qtyDiv.textContent =
            item.qty;


          const priceDiv =
            document.createElement(
              'div'
            );


          priceDiv.className =
            'item-number';


          priceDiv.textContent =
            '$' +
            formatMoney(
              item.price
            );


          const subtotalDiv =
            document.createElement(
              'div'
            );


          subtotalDiv.className =
            'item-number';


          subtotalDiv.textContent =
            '$' +
            formatMoney(
              item.subtotal
            );


          row.appendChild(
            nameDiv
          );


          row.appendChild(
            qtyDiv
          );


          row.appendChild(
            priceDiv
          );


          row.appendChild(
            subtotalDiv
          );


          card.appendChild(
            row
          );

        }
      );


      /*******************************************
       * 備註
       *******************************************/
      if (
        order['備註']
      ) {

        const note =
          document.createElement(
            'div'
          );


        note.className =
          'order-note';


        note.textContent =
          '備註：' +
          order['備註'];


        card.appendChild(
          note
        );

      }


      container.appendChild(
        card
      );

    }
  );


  /*********************************************
   * 最後品項總數量
   *********************************************/
  const totalCard =
    document.createElement(
      'div'
    );


  totalCard.className =
    'product-total-card';


  const title =
    document.createElement(
      'div'
    );


  title.className =
    'product-total-title';


  title.textContent =
    '品項總數量';


  totalCard.appendChild(
    title
  );


  const totalHeader =
    document.createElement(
      'div'
    );


  totalHeader.className =
    'product-total-header';


  totalHeader.innerHTML =
    '<div>品項</div>' +
    '<div>總數量</div>';


  totalCard.appendChild(
    totalHeader
  );


  products.forEach(
    function(product) {

      const qty =
        Number(
          productTotals[
            product.name
          ] || 0
        );


      if (
        qty <= 0
      ) {

        return;

      }


      const row =
        document.createElement(
          'div'
        );


      row.className =
        'product-total-row';


      const name =
        document.createElement(
          'div'
        );


      name.textContent =
        product.name;


      const totalQty =
        document.createElement(
          'div'
        );


      totalQty.className =
        'product-total-qty';


      totalQty.textContent =
        qty;


      row.appendChild(
        name
      );


      row.appendChild(
        totalQty
      );


      totalCard.appendChild(
        row
      );

    }
  );


  container.appendChild(
    totalCard
  );

}


/*************************************************
 * 頁籤
 *************************************************/
function switchTab(
  tab
) {

  const isOrder =
    tab === 'order';


  document.getElementById(
    'orderTab'
  ).classList.toggle(
    'active',
    isOrder
  );


  document.getElementById(
    'searchTab'
  ).classList.toggle(
    'active',
    !isOrder
  );


  document.getElementById(
    'orderSection'
  ).classList.toggle(
    'active',
    isOrder
  );


  document.getElementById(
    'searchSection'
  ).classList.toggle(
    'active',
    !isOrder
  );


  document.getElementById(
    'stickySummary'
  ).style.display =
    isOrder
      ? 'block'
      : 'none';

}


/*************************************************
 * 日期格式
 *************************************************/
function formatDateLabel(
  value
) {

  const parts =
    String(
      value || ''
    ).split('-');


  if (
    parts.length !== 3
  ) {

    return value || '';

  }


  return (
    parts[0] +
    '/' +
    Number(parts[1]) +
    '/' +
    Number(parts[2])
  );

}


/*************************************************
 * 金額
 *************************************************/
function formatMoney(
  value
) {

  return Number(
    value || 0
  ).toLocaleString(
    'zh-TW'
  );

}


/*************************************************
 * 錯誤訊息
 *************************************************/
function showMessage(
  id,
  text,
  type
) {

  const element =
    document.getElementById(
      id
    );


  element.className =
    'message ' +
    type;


  element.textContent =
    text;

}


function hideMessage(
  id
) {

  const element =
    document.getElementById(
      id
    );


  element.className =
    'message';


  element.textContent = '';

}


/*************************************************
 * HTML 安全
 *************************************************/
function escapeHtml(
  value
) {

  return String(
    value == null
      ? ''
      : value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
